[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kuma-discover"
version = "0.1.0"
description = "Find the services Uptime Kuma isn't watching and add monitors after a human says yes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["uptime-kuma-api>=1.2.1,<2", "requests>=2.28"]
keywords = ["uptime-kuma", "monitoring", "homelab", "selfhosted", "docker", "proxmox"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
kuma-discover = "kuma_discover.cli:main"

[project.urls]
Homepage = "https://github.com/casareanderson/kuma-discover"

[tool.setuptools]
packages = ["kuma_discover"]
